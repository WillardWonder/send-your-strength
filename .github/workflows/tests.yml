# Runs on every push: the server logic tests, then the Firestore security rules against the real emulator.
name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Server logic
        run: node functions/test/logic.test.js
      - name: Install rules-test tools
        working-directory: test-rules
        run: npm install --no-audit --no-fund
      - name: Security rules (Firestore emulator)
        working-directory: test-rules
        run: npm test

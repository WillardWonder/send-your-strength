<meta charset="utf-8">
<title>Send Your Strength</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Pick a day. Send a message. Help build the athlete.">
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Caveat:wght@600;700&family=Kalam:wght@400;700&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Send Your Strength. Layout: a poster hero (the athlete's cutout, name, and handwritten note), then month calendars you
   tap like a wall calendar, then standings. One deliberate dark look. Team colors come from team.json and set
   --primary and --accent at load; every other color below is derived from those two. */
:root{
  --primary:#2d68db; --accent:#e3263c; --on-accent:#fff; --on-primary:#fff;
  --primary-hi:color-mix(in oklab,var(--primary) 78%,white); --primary-soft:color-mix(in oklab,var(--primary) 50%,white);
  --accent-deep:color-mix(in oklab,var(--accent) 58%,black); --accent-soft:color-mix(in oklab,var(--accent) 58%,white);
  --night:color-mix(in oklab,var(--primary) 9%,#03050b); --navy:color-mix(in oklab,var(--primary) 17%,#060912);
  --navy-2:color-mix(in oklab,var(--primary) 26%,#080c18); --navy-3:color-mix(in oklab,var(--primary) 37%,#0a0f1f);
  --line:color-mix(in oklab,var(--primary) 38%,#111829); --line-2:color-mix(in oklab,var(--primary) 52%,#141c30);
  --ink:#f3f6ff; --muted:color-mix(in oklab,var(--primary) 22%,#a6adc2); --faint:color-mix(in oklab,var(--primary) 28%,#676e86);
  --gold:#ffcf5c; --paper:#fbf7ef; --paper-ink:#18203a; --ok:#46d39a;
  --display:"Big Shoulders Display","Oswald","Arial Narrow",Impact,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --hand:"Caveat","Bradley Hand","Segoe Print",cursive;
  --note:"Kalam","Bradley Hand","Segoe Print","Comic Sans MS",cursive;
  color-scheme:dark;
}
html{background:var(--night)}
body{background:var(--night);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--night)}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);margin:0;line-height:.95;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--primary-soft)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.eyebrow{font:800 12px/1 var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--primary-soft)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--night) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:7px}
.top img{width:40px;height:auto}
.brand{display:grid;line-height:1;min-width:0}
.brand b{font:900 20px var(--display);text-transform:uppercase;letter-spacing:.02em}
.brand span{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.top nav{margin-left:auto;display:flex;gap:2px;align-items:center}
.top nav a,.top nav button{color:var(--muted);text-decoration:none;font-weight:700;font-size:14px;padding:7px 10px;border-radius:6px;white-space:nowrap}
.top nav a:hover,.top nav button:hover{color:var(--ink);background:var(--navy-2)}
.top nav .me{color:var(--ink);background:var(--navy-2);border:1px solid var(--line-2)}
@media (max-width:620px){.top nav .hide-sm{display:none}}

.demo{background:var(--gold);color:#251b00;font-size:13.5px}
.demo .wrap{padding-block:8px;display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center}
.demo b{font-weight:800}
.demo .views{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.demo .views button{border:1.5px solid #251b00;border-radius:999px;padding:3px 11px;font-weight:700;font-size:13px}
.demo .views button[aria-pressed="true"]{background:#251b00;color:var(--gold)}

/* ---------- poster hero ---------- */
.poster{position:relative;overflow:hidden;background:radial-gradient(110% 80% at 30% 60%,color-mix(in oklab,var(--primary) 42%,#05070f) 0%,var(--navy) 48%,var(--night) 100%);isolation:isolate}
.poster .mat{position:absolute;left:27%;top:96%;width:1100px;max-width:none;transform:translate(-50%,-50%);z-index:-2;pointer-events:none}
@media (max-width:820px){.poster .mat{left:50%;top:44%;width:900px}}
.poster .bigname{position:absolute;left:0;right:0;top:18px;z-index:-1;text-align:center;font:900 clamp(110px,24vw,300px)/.8 var(--display);text-transform:uppercase;letter-spacing:-.01em;
  color:transparent;-webkit-text-stroke:2px color-mix(in srgb,var(--primary-soft) 16%,transparent);white-space:nowrap;overflow:hidden;pointer-events:none}
.poster .wrap{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:8px 30px;align-items:end;padding-block:30px 0;min-height:520px}
@media (max-width:820px){.poster .wrap{grid-template-columns:1fr;min-height:0;padding-block:20px 0}}
.fig{position:relative;align-self:end;display:grid;justify-items:center;min-height:420px}
@media (max-width:820px){.fig{min-height:0;order:1}}
.fig .cut{display:block;max-height:500px;width:auto;max-width:100%;filter:drop-shadow(0 18px 24px rgba(0,0,0,.55)) drop-shadow(0 0 40px color-mix(in srgb,var(--primary-hi) 35%,transparent))}
@media (max-width:820px){.fig .cut{max-height:340px}}
.fig .framed{width:min(330px,80vw);aspect-ratio:4/5;object-fit:cover;border-radius:180px 180px 16px 16px;border:5px solid var(--ink);box-shadow:0 0 0 6px var(--accent),0 20px 40px rgba(0,0,0,.5);margin-bottom:26px}
.fig .ph{width:min(320px,76vw);max-width:100%}
.fig .wt{position:absolute;left:8%;bottom:34px;display:grid;justify-items:center;background:var(--accent);color:var(--on-accent);border-radius:10px;padding:8px 12px 6px;transform:rotate(-6deg);box-shadow:0 8px 18px rgba(0,0,0,.4)}
.fig .wt b{font:900 40px/0.9 var(--display)} .fig .wt span{font:800 11px var(--body);letter-spacing:.18em}
.say{position:relative;align-self:center;padding-bottom:40px}
@media (max-width:820px){.say{order:2;padding-bottom:28px}}
.bubble{position:relative;background:var(--paper);color:var(--paper-ink);border-radius:26px;padding:24px 26px 20px;box-shadow:0 22px 50px rgba(0,0,0,.45)}
.bubble::before{content:"";position:absolute;left:-26px;bottom:62px;border:16px solid transparent;border-right:30px solid var(--paper);border-left:0}
@media (max-width:820px){.bubble::before{left:50%;top:-28px;bottom:auto;transform:translateX(-50%);border:16px solid transparent;border-bottom:30px solid var(--paper);border-top:0}}
.bubble .hi{font:900 clamp(34px,5vw,46px)/.95 var(--display);text-transform:uppercase;color:var(--paper-ink);margin-bottom:10px}
.bubble .hi em{font-style:normal;color:var(--accent)}
.bubble p{margin:0 0 12px;font-size:17px;line-height:1.55;max-width:58ch}
.bubble .sig{font:700 34px/1 var(--hand);color:var(--primary);margin-top:2px;display:flex;align-items:center;gap:10px}
.bubble .sig img{width:34px}
.corner{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;margin-top:18px}
.corner .who{display:flex;align-items:center}
.corner .who i{width:30px;height:30px;border-radius:50%;margin-left:-8px;border:2px solid var(--night);display:grid;place-items:center;font:800 12px var(--body);font-style:normal;color:#fff}
.corner .who i:first-child{margin-left:0}
.corner span{color:var(--muted);font-size:15px}
.corner span b{color:var(--ink)}
.cta{display:inline-flex;align-items:center;gap:10px;background:var(--accent);color:var(--on-accent);font:800 22px/1 var(--display);text-transform:uppercase;letter-spacing:.04em;padding:14px 22px 13px;border-radius:10px;text-decoration:none;box-shadow:0 6px 0 var(--accent-deep)}
.cta:hover{transform:translateY(-1px)} .cta:active{transform:translateY(3px);box-shadow:0 3px 0 var(--accent-deep)}

/* progress strip */
.strip{background:var(--navy);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.strip .wrap{display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr));gap:14px 26px;align-items:center;padding-block:16px}
@media (max-width:700px){.strip .wrap{grid-template-columns:auto 1fr 1fr}.strip .st:last-child{grid-column:2 / span 2}}
.singlet{width:74px}
.singlet svg{width:100%;height:auto;display:block}
.st b{display:block;font:900 38px/1 var(--display)}
.st span{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.st.gold b{color:var(--gold)}

/* roster */
.roster{display:flex;gap:8px;overflow-x:auto;padding-block:16px 4px;scrollbar-width:thin}
.tagbtn{flex:none;display:flex;align-items:center;gap:8px;border:1.5px solid var(--line-2);border-radius:999px;padding:4px 14px 4px 4px;background:var(--navy);font-weight:600;font-size:14.5px}
.tagbtn .w{font:800 13px/1 var(--display);background:var(--navy-2);border-radius:999px;padding:6px 7px 5px;color:var(--primary-soft);min-width:36px;text-align:center}
.tagbtn[aria-pressed="true"]{background:var(--ink);color:var(--night);border-color:var(--ink)}
.tagbtn[aria-pressed="true"] .w{background:var(--primary);color:#fff}

/* price rules */
.rules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:20px}
@media (max-width:700px){.rules{grid-template-columns:1fr}}
.rule{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--navy);display:grid;grid-template-columns:auto 1fr;gap:2px 14px;align-items:center}
.rule .p{grid-row:span 2;font:900 42px/1 var(--display)}
.rule b{font:800 17px var(--display);letter-spacing:.08em;text-transform:uppercase}
.rule span{font-size:13.5px;color:var(--muted);line-height:1.35}
.rule.ev .p{color:var(--accent-soft)} .rule.bk .p{color:var(--gold)}

/* ---------- month calendars ---------- */
.cal{padding-block:34px 6px}
.sechead{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:end;justify-content:space-between;margin-bottom:14px}
.sechead h2{font-size:clamp(38px,6vw,56px);text-transform:uppercase;font-weight:900}
.sechead p{margin:0;color:var(--muted);max-width:52ch}
.monthnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.monthnav a{text-decoration:none;color:var(--ink);font:800 16px var(--display);letter-spacing:.08em;text-transform:uppercase;border:1.5px solid var(--line-2);border-radius:8px;padding:6px 12px 5px}
.monthnav a:hover{border-color:var(--primary-soft)}
.monthnav a small{font:600 12px var(--body);color:var(--muted);letter-spacing:0;text-transform:none;margin-left:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin:10px 0 4px}
.legend i{display:inline-block;width:13px;height:13px;border-radius:4px;margin-right:6px;vertical-align:-2px}
.month{padding-top:22px;scroll-margin-top:70px}
.month-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.month-h h3{font-size:34px;font-weight:900;text-transform:uppercase;letter-spacing:.02em}
.month-h h3 small{font-size:22px;color:var(--faint);margin-left:6px}
.month-h span{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:30px repeat(7,minmax(0,1fr));gap:5px}
@media (min-width:760px){.grid{grid-template-columns:38px repeat(7,minmax(0,1fr));gap:7px}}
.dow{font:800 12px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);text-align:center;padding-bottom:2px}
.wk{display:grid;place-items:center}
.wk button{width:26px;height:26px;border-radius:50%;border:1.5px dashed var(--line-2);color:var(--primary-soft);font:800 15px/1 var(--body);display:grid;place-items:center}
.wk button:hover{border-style:solid;border-color:var(--primary-soft)}
.wk button[aria-pressed="true"]{background:var(--gold);color:var(--night);border:0}
.cell{position:relative;min-height:62px;border-radius:9px;padding:5px 6px;display:flex;flex-direction:column;gap:1px;text-align:left;min-width:0;overflow:hidden}
@media (min-width:760px){.cell{min-height:96px;padding:7px 9px}}
.cell .dn{font:800 17px/1 var(--display)}
@media (min-width:760px){.cell .dn{font-size:20px}}
.cell .lb{font-size:10.5px;line-height:1.15;font-weight:700;letter-spacing:.02em;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media (min-width:760px){.cell .lb{font-size:12.5px}}
.cell .pr{margin-top:auto;font:800 13px/1 var(--display);letter-spacing:.04em}
@media (min-width:760px){.cell .pr{font-size:16px}}
.cell .nm{margin-top:auto;font-size:11px;font-weight:700;line-height:1.15;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding-right:14px}
@media (min-width:760px){.cell .nm{font-size:13px;padding-right:20px}}
.cell .ic{position:absolute;right:5px;bottom:5px;width:14px;height:11px}
@media (min-width:760px){.cell .ic{width:20px;height:16px;right:7px;bottom:7px}}
.cell .ini{display:none;margin-top:auto;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.24);place-items:center;font:800 10px/1 var(--body);color:#fff}
@media (max-width:519px){
  .grid{grid-template-columns:22px minmax(0,.6fr) repeat(5,minmax(0,1fr)) minmax(0,.6fr);gap:4px}
  .cell{min-height:60px;padding:5px}
  .cell .lb,.cell .nm{display:none}
  .cell .ini{display:grid}
  .cell .pr{font-size:14px}
  .cell .ic{top:5px;right:4px;bottom:auto;width:13px;height:10px}
  .cell.blank .dn{font-size:15px}
  .wk button{width:22px;height:22px;font-size:13px}
}
.cell.blank{background:transparent;color:var(--faint);opacity:.5}
.cell.blank .lb{font-weight:500;color:var(--faint)}
.cell.out{visibility:hidden}
.cell.open{background:var(--navy);border:1.5px solid var(--line-2)}
.cell.open .lb{color:var(--muted)}
.cell.open .pr{color:var(--primary-soft)}
.cell.open:hover{border-color:var(--primary-soft)}
.cell.ev{background:linear-gradient(165deg,color-mix(in oklab,var(--accent) 26%,var(--night)),color-mix(in oklab,var(--accent) 8%,var(--navy)));border:1.5px solid color-mix(in oklab,var(--accent) 55%,var(--night))}
.cell.ev .lb{color:color-mix(in oklab,var(--accent) 14%,white)}
.cell.ev .pr{color:var(--accent-soft)}
.cell.ev:hover{border-color:var(--accent-soft)}
.cell.cont{background:repeating-linear-gradient(135deg,color-mix(in oklab,var(--accent) 20%,var(--night)) 0 6px,color-mix(in oklab,var(--accent) 8%,var(--navy)) 6px 12px);border:1.5px solid color-mix(in oklab,var(--accent) 40%,var(--night));color:color-mix(in oklab,var(--accent) 14%,white)}
.cell.paid{background:var(--primary);border:1.5px solid var(--primary-hi);color:#fff}
.cell.paid .lb{color:color-mix(in oklab,var(--primary) 14%,white)}
.cell.paid.evp{background:linear-gradient(165deg,var(--primary),color-mix(in oklab,var(--primary) 55%,var(--accent)))}
.cell.held{background:repeating-linear-gradient(135deg,var(--navy-2) 0 7px,var(--navy) 7px 14px);border:1.5px dashed var(--line-2)}
.cell.held .nm{color:var(--muted);font-weight:600}
.cell.sel{background:#3a3214;border:2px solid var(--gold);color:#fff}
.cell.sel .pr{color:var(--gold)}
.cell.sel::after{content:"";position:absolute;right:6px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--gold)}
.cell.off{background:transparent;border:1.5px dashed var(--line);opacity:.55}
.cell.today{box-shadow:0 0 0 2px var(--night),0 0 0 4px var(--ink)}
.cell.past:not(.paid):not(.sel){opacity:.72}
.cell[disabled]{cursor:default}
@media (prefers-reduced-motion:no-preference){.cell{transition:transform .12s,border-color .15s,background .15s}button.cell:active:not([disabled]){transform:scale(.95)}}

/* backers, standings */
.panel{padding-block:36px 4px}
.backers{display:flex;flex-wrap:wrap;gap:8px}
.backer{display:flex;align-items:center;gap:8px;background:var(--navy-2);border:1px solid var(--line-2);border-radius:999px;padding:5px 14px 5px 5px;font-weight:700}
.backer img{width:26px}
.empty{color:var(--muted);font-style:italic;margin:0}
.teamtotal{display:flex;flex-wrap:wrap;gap:6px 26px;align-items:baseline;margin-bottom:14px}
.teamtotal b{font:900 60px/1 var(--display);color:var(--gold)}
.teamtotal span{color:var(--muted)}
.board{display:grid;gap:6px}
.rank{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:4px 12px;align-items:center;background:var(--navy);border:1px solid var(--line);border-radius:12px;padding:10px 14px;text-align:left;width:100%}
.rank:hover{border-color:var(--line-2)}
.rank .pos{grid-row:span 2;font:900 32px/1 var(--display);color:var(--faint);text-align:center}
.rank.first .pos{color:var(--gold)}
.rank .nm{font-weight:700;display:flex;gap:8px;align-items:baseline;min-width:0}
.rank .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .nm small{font:800 12px var(--display);color:var(--primary-soft);letter-spacing:.06em}
.rank .bar{height:7px;background:var(--navy-2);border-radius:4px;overflow:hidden}
.rank .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--primary-soft));border-radius:4px}
.rank .amt{grid-row:1 / span 2;grid-column:3;text-align:right;font:900 26px/1 var(--display)}
.rank .amt small{display:block;font:500 12px var(--body);color:var(--muted);margin-top:4px}
.howto{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:760px){.howto{grid-template-columns:1fr}}
.howto div{background:var(--navy);border:1px solid var(--line);border-radius:12px;padding:16px}
.howto b{display:block;font:900 32px/1 var(--display);color:var(--accent-soft)}
.howto h3{font-size:21px;text-transform:uppercase;margin:8px 0 4px;font-weight:800}
.howto p{margin:0;color:var(--muted);font-size:14.5px}
.foot{color:var(--faint);font-size:13px;padding-block:30px 120px;display:flex;gap:14px;flex-wrap:wrap;justify-content:space-between;border-top:1px solid var(--line);margin-top:36px}
.foot button{color:var(--muted);text-decoration:underline}

/* ---------- her locker (private) ---------- */
.locker{margin-top:22px;border:1px solid var(--line-2);border-radius:18px;background:linear-gradient(160deg,var(--navy-2),var(--navy) 60%);padding:20px;display:grid;gap:22px}
.locker h2{font-size:40px;text-transform:uppercase;font-weight:900}
.locker h3{font-size:24px;text-transform:uppercase;font-weight:800;margin-bottom:10px}
.todaynote{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center;background:var(--night);border:1px solid var(--line);border-radius:14px;padding:18px}
@media (max-width:560px){.todaynote{grid-template-columns:1fr;justify-items:start}}
.todaynote .env{width:96px}
.todaynote .env svg{width:100%;height:auto;overflow:visible}
.todaynote q{display:block;font-size:21px;line-height:1.45;quotes:"\201C" "\201D";max-width:56ch}
.todaynote .from{font:700 30px/1 var(--hand);color:var(--primary-soft);margin-top:8px}
.todaynote p{margin:6px 0 0;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.todaynote.open .flap{transform-box:fill-box;transform-origin:50% 0;animation:flap .9s .25s both}.todaynote.open .letter{animation:rise .8s .8s both}}
@keyframes flap{to{transform:scaleY(-1)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.notecard{background:var(--paper);color:var(--paper-ink);border-radius:4px 4px 14px 4px;padding:16px 16px 12px;transform:rotate(var(--r,0deg));box-shadow:0 8px 18px rgba(0,0,0,.35);display:grid;gap:6px}
.notecard p{margin:0;font-size:16px;line-height:1.45}
.notecard footer{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.notecard footer b{font:700 24px/1 var(--hand);color:var(--primary)}
.notecard footer span{font-size:12px;color:#5b6582;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.sealed{display:flex;flex-wrap:wrap;gap:8px}
.sealed span{display:flex;gap:8px;align-items:center;background:var(--night);border:1px dashed var(--line-2);border-radius:999px;padding:5px 12px 5px 8px;font-size:14px;font-weight:600}
